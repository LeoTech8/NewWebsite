<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NCS Radio</title>
<style>
  /* Base Layout Reset */
  body {
    margin: 0;
    padding: 0;
    background-color: #0d0e12;
    color: #e2e8f0;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }

  /* Main Radio Container Terminal */
  .radio-terminal {
    background: linear-gradient(145deg, #13161c, #1a1f26);
    border: 1px solid #22d3ee20;
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(34, 211, 238, 0.05);
    width: 360px;
    padding: 32px;
    text-align: center;
    position: relative;
  }

  /* Cyberpunk Glass Accent Layer */
  .radio-terminal::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, #06b6d4, #3b82f6);
    border-top-left-radius: 16px;
    border-top-right-radius: 16px;
  }

  /* Unified Overlay & Visualizer Layout Wrappers */
  #unlock-overlay, #visualizer {
    width: 100%;
  }

  /* Interactive Control Action Button */
  #connect-btn {
    background: linear-gradient(135deg, #06b6d4, #0891b2);
    color: #ffffff;
    border: none;
    padding: 16px 32px;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(6, 182, 212, 0.4);
    transition: all 0.25s ease;
  }

  #connect-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(6, 182, 212, 0.6);
    background: linear-gradient(135deg, #0891b2, #06b6d4);
  }

  #connect-btn:active {
    transform: translateY(1px);
  }

  /* Typography Text Elements */
  #track-title {
    font-size: 1.4rem;
    font-weight: 700;
    color: #ffffff;
    margin: 0 0 8px 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #track-artist {
    font-size: 0.95rem;
    font-weight: 400;
    color: #94a3b8;
    margin: 0 0 24px 0;
  }

  #sync-status {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #22d3ee;
    background-color: rgba(34, 211, 238, 0.1);
    padding: 6px 12px;
    border-radius: 20px;
    margin-bottom: 32px;
  }

  /* Audio Interface Volume Controller Group */
  .volume-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(0, 0, 0, 0.2);
    padding: 12px 16px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }

  #vol-icon {
    font-size: 1.1rem;
    color: #94a3b8;
    width: 24px;
    text-align: center;
  }

  #volume {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 6px;
    background: #1e293b;
    border-radius: 3px;
    outline: none;
    cursor: pointer;
  }

  #volume::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #22d3ee;
    box-shadow: 0 0 8px #22d3ee;
    transition: transform 0.1s ease;
  }

  #volume::-webkit-slider-thumb:hover {
    transform: scale(1.2);
  }

  /* Hidden Mounting Canvas Platform Override */
  #youtube-player {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }
</style>

</head>
<body>

  <div class="radio-terminal">
    <!-- Unlocking Node Structure -->
    <div id="unlock-overlay">
      <button id="connect-btn" onclick="connectToRadio()">Connect to Radio</button>
    </div>

    <!-- Active Media Playing Elements -->
    <div id="visualizer" style="display: none;">
      <div id="sync-status">Status: Initialising</div>
      <h2 id="track-title">Track Title</h2>
      <h3 id="track-artist">By: Artist</h3>
      
      <div class="volume-container">
        <span id="vol-icon">🔊</span>
        <input type="range" id="volume" min="0" max="100" value="50" oninput="adjustVolume(this.value)">
      </div>
    </div>
  </div>

  <!-- API Anchor Point -->
  <div id="youtube-player"></div>


  <script>
    // 1. FIXED: Correctly query the collection item index element node
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    const playlist = [
      { id: "K4O4gTxw1c0", title: "Cradles", artist: "Sub Urban", duration: 213 },
      { id: "bM7SZ5SBzyY", title: "Fade", artist: "Alan Walker", duration: 264 },
      { id: "K381fIUREn8", title: "Invincible", artist: "DEAF KEV", duration: 273 },
      { id: "p7ZsBPK656s", title: "My Heart", artist: "Different Heaven & EH!DE", duration: 267 },
      { id: "zndv0K8EwEc", title: "Superhero", artist: "Unknown Brain", duration: 182 },
      { id: "3nQNiWdeH7M", title: "Heroes Tonight", artist: "Janji", duration: 208 },
      { id: "TW9d8vYrVFQ", title: "Fearless", artist: "Lost Sky", duration: 195 },
      { id: "ux8-Xw0Hj5c", title: "Blank", artist: "Disfigure", duration: 213 },
      { id: "f6Zk4Lx0cJ4", title: "Symbolism", artist: "Electro-Light", duration: 198 },
      { id: "bA8A39Z8Z8o", title: "On & On", artist: "Cartoon", duration: 208 }, 
      { "id": "y6zcHMsPWVs", "title": "Fast Lane", "artist": "NIVIRO, PollyAnna", "duration": 204 },
      { "id": "bM7SZ5SBzyY", "title": "Dreamer", "artist": "Alan Walker", "duration": 164 },
      { "id": "zj3bs-5lDnM", "title": "Flares", "artist": "NIVIRO", "duration": 221 },
      { "id": "LOSs2p9Xcos", "title": "Skyline", "artist": "Kovan, Electro-Light", "duration": 205 },
      { "id": "W9N3vF_9onM", "title": "We Are", "artist": "Kisma", "duration": 211 },
      { "id": "K4O4gTxw1c0", "title": "Linked", "artist": "Jim Yosef, Anna Yvette", "duration": 223 },
      { "id": "EmBs5Qm06cw", "title": "Call Me Again", "artist": "Raven & Kreyn", "duration": 161 },
      { "id": "bZHMkKkFgck", "title": "Your Stories", "artist": "Cartoon, Jéja, KOIT TOOME", "duration": 164 }
    ];

    const TOTAL_PLAYLIST_DURATION = playlist.reduce((sum, track) => sum + track.duration, 0);
    let player;
    let currentVideoId = "";
    let isApiReady = false; // Flag to trace active initialization state

    function getLiveTrackState() {
      const currentGlobalSeconds = Math.floor(Date.now() / 1000);
      let timeIntoCurrentLoop = currentGlobalSeconds % TOTAL_PLAYLIST_DURATION;
      
      for (let i = 0; i < playlist.length; i++) {
        if (timeIntoCurrentLoop < playlist[i].duration) {
          return {
            videoId: playlist[i].id,
            seekTime: timeIntoCurrentLoop,
            title: playlist[i].title,
            artist: playlist[i].artist,
            trackIndex: i
          };
        }
        timeIntoCurrentLoop -= playlist[i].duration;
      }
      return { videoId: playlist[0].id, seekTime: 0, title: playlist[0].title, artist: playlist[0].artist, trackIndex: 0 };
    }

    function onYouTubeIframeAPIReady() {
      const freshSync = getLiveTrackState();
      currentVideoId = freshSync.videoId;

      player = new YT.Player('youtube-player', {
        height: '1',
        width: '1',
        videoId: freshSync.videoId,
        playerVars: {
          'autoplay': 0,
          'controls': 0,
          'disablekb': 1,
          'rel': 0,
          'start': freshSync.seekTime
        },
        events: {
          'onReady': onPlayerReady
        }
      });
    }

    function onPlayerReady(event) {
      isApiReady = true; // Unlock execution flag for radio stream bindings
      const initialVol = document.getElementById('volume').value;
      player.setVolume(initialVol);
    }

    function adjustVolume(value) {
      const iconEl = document.getElementById('vol-icon');
      if (value == 0) iconEl.innerText = "🔇";
      else if (value < 40) iconEl.innerText = "🔈";
      else if (value < 75) iconEl.innerText = "🔉";
      else iconEl.innerText = "🔊";

      if (player && typeof player.setVolume === 'function') {
        player.setVolume(value);
      }
    }

    function connectToRadio() {
      // FIXED SAFETY GUARD: If API loading is sluggish, retry action sequentially
      if (!isApiReady) {
        document.getElementById('sync-status').innerText = "Status: Loading Engine Components...";
        setTimeout(connectToRadio, 250);
        return;
      }

      document.getElementById('unlock-overlay').style.display = 'none';
      document.getElementById('visualizer').style.display = 'block';
      
      const freshSync = getLiveTrackState();
      currentVideoId = freshSync.videoId;
      
      document.getElementById('track-title').innerText = freshSync.title;
      document.getElementById('track-artist').innerText = "By: " + freshSync.artist;
      document.getElementById('sync-status').innerText = "Status: Live Sync";

      if (player && typeof player.loadVideoById === 'function') {
        player.unMute();
        player.loadVideoById({
          videoId: freshSync.videoId,
          startSeconds: freshSync.seekTime
        });
        
        player.playVideo();
        const currentVol = document.getElementById('volume').value;
        player.setVolume(currentVol);
      }

      setInterval(function() {
        const checkSync = getLiveTrackState();
        
        if (checkSync.videoId !== currentVideoId) {
          currentVideoId = checkSync.videoId;
          
          document.getElementById('track-title').innerText = checkSync.title;
          document.getElementById('track-artist').innerText = "By: " + checkSync.artist;
          
          if (player && typeof player.loadVideoById === 'function') {
            player.loadVideoById({
              videoId: checkSync.videoId,
              startSeconds: checkSync.seekTime
            });
            player.playVideo();
          }
        }
      }, 1000);
    }
  </script>
</body>
</html>
