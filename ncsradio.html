<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NCS Radio</title>

  <meta name="referrer" content="strict-origin-when-cross-origin">

  <style>
    :root {
      --bg-dark: #121214;
      --panel-dark: #1c1c1f;
      --accent-red: #02e6e6;
      --text-main: #f5f5f7;
      --text-muted: #86868b;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .dashboard-container {
      width: 100%;
      max-width: 440px;
      background: var(--panel-dark);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,.3);
      padding: 24px;
      box-sizing: border-box;
    }

    .header-badge {
      display: inline-block;
      background: rgba(255,71,87,.15);
      color: var(--accent-red);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 6px 12px;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    .player-wrapper {
      position: relative;
      width: 100%;
      height: 220px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .click-shield {
      position: absolute;
      inset: 0;
      z-index: 10;
      background: transparent;
      cursor: not-allowed;
    }

    .unlock-overlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      background: rgba(18,18,20,.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }

    .connect-btn {
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      color: white;
      background: var(--accent-red);
      box-shadow: 0 4px 15px rgba(255,71,87,.4);
    }

    .connect-btn:hover {
      transform: scale(1.03);
    }

    .track-info {
      margin-bottom: 20px;
    }

    .track-title {
      margin: 0 0 5px;
      font-size: 20px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .track-artist {
      margin: 0;
      color: var(--text-muted);
    }

    .controls-panel {
      background: rgba(255,255,255,.03);
      border-radius: 12px;
      padding: 16px;
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .volume-slider {
      flex: 1;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,.05);
      font-size: 12px;
      color: var(--text-muted);
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-red);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% {transform:scale(.95);}
      50% {transform:scale(1.2);}
      100% {transform:scale(.95);}
    }

    #youtube-player {
      width:100%;
      height:100%;
    }
  </style>
</head>

<body>

<div class="dashboard-container">

<div class="header-badge">
NCS Radio
</div>

<div class="player-wrapper">

<div id="youtube-player"></div>

<div class="click-shield"></div>

<div id="unlock-overlay" class="unlock-overlay">
<button class="connect-btn" onclick="connectToRadio()">
▶ Connect to Radio
</button>

<span style="font-size:12px;color:#86868b;">
Click to join
</span>
</div>

</div>

<div class="track-info">
<h3 id="track-title" class="track-title">
NCS Radio
</h3>

<p id="track-artist" class="track-artist">
Click to unmute audio
</p>
</div>

<div class="controls-panel">

<div class="volume-container">

<span id="vol-icon">
🔊
</span>

<input
id="volume"
class="volume-slider"
type="range"
min="0"
max="100"
value="80"
oninput="adjustVolume(this.value)"
>

</div>

<div class="status-row">

<div class="status-indicator">
<div class="pulse-dot"></div>
<span>On Air (Global Sync)</span>
</div>

<div id="sync-status">
Status: Loading...
</div>

</div>

</div>

</div>

<script>

const tag=document.createElement("script");
tag.src="https://www.youtube.com/iframe_api";
document.head.appendChild(tag);

const playlist=[
{id:"FZC-XgLk8O4",title:"Into The Wild",artist:"Alex Skrindo, Kovan, Izzy",duration:null},
{id:"DqUQW3xyQ1c",title:"Fast Lane",artist:"NIVIRO, PollyAnna",duration:null},
{id:"FseAiTb8Se0",title:"Skyline",artist:"Kovan, Electro-Light",duration:null},
{id:"WfluodjOkOk",title:"We Are",artist:"Kisma",duration:null},
{id:"IS9azbb9hSA",title:"Vitality",artist:"Elektronomia",duration:null},
{id:"yHLtE1wFeRQ",title:"Linked",artist:"Jim Yosef & Anna Yvette",duration:null},
{id:"geOGWGe0aB8",title:"Campfire",artist:"RetroVision",duration:null},
{id:"Np-Y8ClGgRk",title:"Ruby",artist:"Jim Yosef & Alex Skrindo",duration:null},
];

let TOTAL_PLAYLIST_DURATION=0;

let player;
let radioActive=false;
let currentVideoId="";
let durationsLoaded=false;
let syncTimer=null;
let loadingDurations=false;
function loadPlaylistDurations() {
  if (loadingDurations || durationsLoaded) return;

  loadingDurations = true;

  let tempPlayer = document.createElement("div");
  tempPlayer.id = "duration-loader";
  tempPlayer.style.display = "none";
  document.body.appendChild(tempPlayer);

  let index = 0;

  function loadNextDuration() {

    if (index >= playlist.length) {
      TOTAL_PLAYLIST_DURATION = playlist.reduce(
        (sum, track) => sum + track.duration,
        0
      );

      durationsLoaded = true;
      loadingDurations = false;

      document.getElementById("sync-status").innerText =
        "Status: Live Sync";

      return;
    }


    let video = playlist[index];


    let durationPlayer = new YT.Player("duration-loader", {

      videoId: video.id,

      playerVars: {
        controls: 0,
        autoplay: 0
      },

      events: {

        onReady: function(event) {

          video.duration = Math.floor(
            event.target.getDuration()
          );


          event.target.destroy();


          index++;

          loadNextDuration();

        }

      }

    });

  }


  loadNextDuration();

}



function getLiveTrackState() {

  if (!durationsLoaded) {

    return {
      videoId: playlist[0].id,
      seekTime: 0,
      title: playlist[0].title,
      artist: playlist[0].artist,
      trackIndex: 0
    };

  }


  const now = Math.floor(Date.now() / 1000);


  let loopTime =
    now % TOTAL_PLAYLIST_DURATION;



  for (
    let i = 0;
    i < playlist.length;
    i++
  ) {


    if (
      loopTime <
      playlist[i].duration
    ) {


      return {

        videoId: playlist[i].id,

        seekTime: loopTime,

        title: playlist[i].title,

        artist: playlist[i].artist,

        trackIndex: i

      };

    }


    loopTime -= playlist[i].duration;


  }



  return {

    videoId: playlist[0].id,

    seekTime:0,

    title:playlist[0].title,

    artist:playlist[0].artist,

    trackIndex:0

  };


}




function onYouTubeIframeAPIReady() {


  player = new YT.Player(
    "youtube-player",
    {


      height:"100%",
      width:"100%",


      videoId:playlist[0].id,


      playerVars:{

        autoplay:0,

        controls:0,

        disablekb:1,

        rel:0,

        enablejsapi:1,

        iv_load_policy:3,

        fs:0

      },


      events:{


        onReady:function(event){


          player.setVolume(
            document.getElementById("volume").value
          );


          loadPlaylistDurations();


        },


        onStateChange:onPlayerStateChange


      }


    }
  );


}




function onPlayerStateChange(event){


  if(
    radioActive &&
    (
      event.data === YT.PlayerState.ENDED ||
      event.data === YT.PlayerState.PAUSED
    )
  ){

    forceResync();

  }


}




function adjustVolume(value){


  const icon =
    document.getElementById("vol-icon");


  if(value == 0){

    icon.innerText="🔇";

  }
  else if(value < 40){

    icon.innerText="🔈";

  }
  else if(value < 75){

    icon.innerText="🔉";

  }
  else {

    icon.innerText="🔊";

  }



  if(
    player &&
    typeof player.setVolume==="function"
  ){

    player.setVolume(value);

  }


}
  function updateTrackInfo(track) {

  document.getElementById("track-title").innerText =
    track.title;

  document.getElementById("track-artist").innerText =
    "By: " + track.artist;

}



function forceResync() {


  if(!player || !durationsLoaded) return;


  const freshSync =
    getLiveTrackState();



  currentVideoId =
    freshSync.videoId;



  updateTrackInfo({
    title:freshSync.title,
    artist:freshSync.artist
  });



  document.getElementById("sync-status").innerText =
    "Status: Re-syncing...";



  player.loadVideoById({

    videoId:freshSync.videoId,

    startSeconds:freshSync.seekTime

  });



  setTimeout(function(){


    if(player){

      player.playVideo();

    }


    document.getElementById("sync-status").innerText =
      "Status: Live Sync";


  },500);



}





function checkSync(){


  if(
    !radioActive ||
    !player ||
    !durationsLoaded
  ){

    return;

  }



  const expected =
    getLiveTrackState();



  if(
    expected.videoId !== currentVideoId
  ){

    forceResync();

    return;

  }



  const actual =
    player.getCurrentTime();



  const difference =
    Math.abs(
      actual - expected.seekTime
    );



  /*
    If the player is more than
    2 seconds away from the global
    radio position, correct it.
  */


  if(difference > 2){


    document.getElementById("sync-status").innerText =
      "Status: Correcting drift...";


    player.seekTo(
      expected.seekTime,
      true
    );
    setTimeout(function(){
      document.getElementById("sync-status").innerText =
        "Status: Live Sync";
    },1000);
  }
}
function connectToRadio(){
  radioActive=true;
  document.getElementById(
    "unlock-overlay"
  ).style.display="none";
  if(!durationsLoaded){
    document.getElementById(
      "sync-status"
    ).innerText =
      "Status: Loading tracks...";
    let wait =
      setInterval(function(){
        if(durationsLoaded){
         clearInterval(wait);
          forceResync();
        }
      },250);
  }
  else {
    forceResync();
  }
  if(!syncTimer){


    syncTimer =
      setInterval(
        checkSync,
        1500
      );
  }
}
window.addEventListener("beforeunload", function(){

  if(syncTimer){

    clearInterval(syncTimer);

  }

});



// Safety check:
// If YouTube API loads late,
// retry duration loading.

setInterval(function(){

  if(
    player &&
    !durationsLoaded &&
    !loadingDurations
  ){

    loadPlaylistDurations();

  }

},5000);



</script>

</body>
</html>
