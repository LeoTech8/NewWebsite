<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Synced NCS Radio Dashboard</title>
  
  <!-- Enforces browser to send secure referrer tokens to unblock YouTube streams -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  
  <style>
    :root {
      --bg-dark: #121214;
      --panel-dark: #1c1c1f;
      --accent-red: #ff4757;
      --text-main: #f5f5f7;
      --text-muted: #86868b;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .dashboard-container {
      width: 100%;
      max-width: 440px;
      background: var(--panel-dark);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      padding: 24px;
      box-sizing: border-box;
    }

    .header-badge {
      display: inline-block;
      background: rgba(255, 71, 87, 0.15);
      color: var(--accent-red);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 6px 12px;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    .player-wrapper {
      position: relative;
      width: 100%;
      height: 220px;
      background: #050505;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .radio-visualizer {
      width: 80px;
      height: 80px;
      border: 4px solid var(--accent-red);
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 3s linear infinite;
      display: none;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .unlock-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      background: rgba(18, 18, 20, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .connect-btn {
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 700;
      background: var(--accent-red);
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
      transition: transform 0.2s, background 0.2s;
    }

    .connect-btn:hover {
      transform: scale(1.03);
      background: #ff5e6c;
    }

    .track-info {
      text-align: left;
      margin-bottom: 24px;
    }

    .track-title {
      margin: 0 0 6px 0;
      font-size: 20px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      margin: 0;
      font-size: 14px;
      color: var(--text-muted);
    }

    .controls-panel {
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .volume-icon {
      font-size: 18px;
      color: var(--text-muted);
      width: 24px;
    }

    .volume-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #3a3a3c;
      outline: none;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--text-main);
      cursor: pointer;
      transition: background 0.15s;
    }

    .volume-slider::-webkit-slider-thumb:hover {
      background: var(--accent-red);
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 12px;
      margin-top: 4px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background: var(--accent-red);
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7);
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(255, 71, 87, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
    }

    #yt-hidden-container {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="yt-hidden-container">
    <div id="youtube-player"></div>
  </div>

  <div class="dashboard-container">
    <div class="header-badge">NCS Live Broadcast</div>
    
    <div class="player-wrapper">
      <div id="visualizer" class="radio-visualizer"></div>
      
      <div id="unlock-overlay" class="unlock-overlay">
        <button onclick="connectToRadio()" class="connect-btn">▶ Connect to Radio</button>
        <span style="font-size: 12px; color: var(--text-muted);">Click to join live sync</span>
      </div>
    </div>

    <div class="track-info">
      <h3 id="track-title" class="track-title">Live Radio Stream</h3>
      <p id="track-artist" class="track-artist">Click connect to unmute audio</p>
    </div>

    <div class="controls-panel">
      <div class="volume-container">
        <span id="vol-icon" class="volume-icon">🔊</span>
        <input 
          type="range" 
          id="volume" 
          class="volume-slider" 
          min="0" 
          max="100" 
          value="80" 
          oninput="adjustVolume(this.value)"
        >
      </div>

      <div class="status-row">
        <div class="status-indicator">
          <div class="pulse-dot"></div>
          <span>On Air (Global Sync)</span>
        </div>
        <div id="sync-status">Status: Ready</div>
      </div>
    </div>
  </div>
  <script>
    // Load the official YouTube Iframe Player API script asynchronously
    const tag = document.createElement('script');
    tag.src = "https://youtube.com";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    const playlist = [
      { id: "K4O4gTxw1c0", title: "Cradles", artist: "Sub Urban", duration: 213 },
      { id: "bM7SZ5SBzyY", title: "Fade", artist: "Alan Walker", duration: 264 },
      { id: "K381fIUREn8", title: "Invincible", artist: "DEAF KEV", duration: 273 },
      { id: "p7ZsBPK656s", title: "My Heart", artist: "Different Heaven & EH!DE", duration: 267 },
      { id: "zndv0K8EwEc", title: "Superhero", artist: "Unknown Brain", duration: 182 },
      { id: "3nQNiWdeH7M", title: "Heroes Tonight", artist: "Janji", duration: 208 },
      { id: "TW9d8vYrVFQ", title: "Fearless", artist: "Lost Sky", duration: 195 },
      { id: "ux8-Xw0Hj5c", title: "Blank", artist: "Disfigure", duration: 213 },
      { id: "f6Zk4Lx0cJ4", title: "Symbolism", artist: "Electro-Light", duration: 198 },
      { id: "bA8A39Z8Z8o", title: "On & On", artist: "Cartoon", duration: 208 }
  {"id": "y6zcHMsPWVs", "title": "Fast Lane", "artist": "NIVIRO, PollyAnna", "duration": 204},
  {"id": "bM7SZ5SBzyY", "title": "Dreamer", "artist": "Alan Walker", "duration": 164},
  {"id": "zj3bs-5lDnM", "title": "Flares", "artist": "NIVIRO", "duration": 221},
  {"id": "LOSs2p9Xcos", "title": "Skyline", "artist": "Kovan, Electro-Light", "duration": 205},
  {"id": "W9N3vF_9onM", "title": "We Are", "artist": "Kisma", "duration": 211},
  {"id": "K4O4gTxw1c0", "title": "Linked", "artist": "Jim Yosef, Anna Yvette", "duration": 223},
  {"id": "EmBs5Qm06cw", "title": "Call Me Again", "artist": "Raven & Kreyn", "duration": 161},
  {"id": "bZHMkKkFgck", "title": "Your Stories", "artist": "Cartoon, Jéja, KOIT TOOME", "duration": 164}

    ];

    const TOTAL_PLAYLIST_DURATION = playlist.reduce((sum, track) => sum + track.duration, 0);
    let player;
    let currentVideoId = "";

    function getLiveTrackState() {
      const currentGlobalSeconds = Math.floor(Date.now() / 1000);
      let timeIntoCurrentLoop = currentGlobalSeconds % TOTAL_PLAYLIST_DURATION;
      
      for (let i = 0; i < playlist.length; i++) {
        if (timeIntoCurrentLoop < playlist[i].duration) {
          return {
            videoId: playlist[i].id,
            seekTime: timeIntoCurrentLoop,
            title: playlist[i].title,
            artist: playlist[i].artist,
            trackIndex: i
          };
        }
        timeIntoCurrentLoop -= playlist[i].duration;
      }
      return { videoId: playlist[0].id, seekTime: 0, title: playlist[0].title, artist: playlist[0].artist, trackIndex: 0 };
    }

    // Required entry function for YouTube API to hook player target binding options
    function onYouTubeIframeAPIReady() {
      const freshSync = getLiveTrackState();
      currentVideoId = freshSync.videoId;

      player = new YT.Player('youtube-player', {
        height: '1',
        width: '1',
        videoId: freshSync.videoId,
        playerVars: {
          'autoplay': 0,
          'controls': 0,
          'disablekb': 1,
          'rel': 0,
          'start': freshSync.seekTime
        },
        events: {
          'onReady': onPlayerReady
        }
      });
    }

    function onPlayerReady(event) {
      // Set initial volume state from slider setting
      const initialVol = document.getElementById('volume').value;
      player.setVolume(initialVol);
    }

    function adjustVolume(value) {
      const iconEl = document.getElementById('vol-icon');
      if (value == 0) iconEl.innerText = "🔇";
      else if (value < 40) iconEl.innerText = "🔈";
      else if (value < 75) iconEl.innerText = "🔉";
      else iconEl.innerText = "🔊";

      // Direct communication loop adjusting player engine audio streams
      if (player && typeof player.setVolume === 'function') {
        player.setVolume(value);
      }
    }

    function connectToRadio() {
      document.getElementById('unlock-overlay').style.display = 'none';
      document.getElementById('visualizer').style.display = 'block';
      
      const freshSync = getLiveTrackState();
      currentVideoId = freshSync.videoId;
      
      document.getElementById('track-title').innerText = freshSync.title;
      document.getElementById('track-artist').innerText = "By: " + freshSync.artist;
      document.getElementById('sync-status').innerText = "Status: Live Sync";

      if (player && typeof player.loadVideoById === 'function') {
        player.loadVideoById({
          videoId: freshSync.videoId,
          startSeconds: freshSync.seekTime
        });
        const currentVol = document.getElementById('volume').value;
        player.setVolume(currentVol);
      }

      // Check loop verification tracking track switches every 1000ms
      setInterval(function() {
        const checkSync = getLiveTrackState();
        
        if (checkSync.videoId !== currentVideoId) {
          currentVideoId = checkSync.videoId;
          
          document.getElementById('track-title').innerText = checkSync.title;
          document.getElementById('track-artist').innerText = "By: " + checkSync.artist;
          
          if (player && typeof player.loadVideoById === 'function') {
            player.loadVideoById({
              videoId: checkSync.videoId,
              startSeconds: checkSync.seekTime
        });
          }
        }
      }, 1000);
    }
  </script>
</body>
</html>
