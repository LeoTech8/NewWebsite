<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Synced NCS Radio Dashboard</title>
  <style>
    :root {
      --bg-dark: #121214;
      --panel-dark: #1c1c1f;
      --accent-red: #ff4757;
      --text-main: #f5f5f7;
      --text-muted: #86868b;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .dashboard-container {
      width: 100%;
      max-width: 440px;
      background: var(--panel-dark);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      padding: 24px;
      box-sizing: border-box;
    }

    .header-badge {
      display: inline-block;
      background: rgba(255, 71, 87, 0.15);
      color: var(--accent-red);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 6px 12px;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    .player-wrapper {
      position: relative;
      width: 100%;
      height: 220px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .click-shield {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
    }

    .unlock-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      background: rgba(18, 18, 20, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .connect-btn {
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 700;
      background: var(--accent-red);
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
      transition: transform 0.2s, background 0.2s;
    }

    .connect-btn:hover {
      transform: scale(1.03);
      background: #ff5e6c;
    }

    .track-info {
      text-align: left;
      margin-bottom: 24px;
    }

    .track-title {
      margin: 0 0 6px 0;
      font-size: 20px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      margin: 0;
      font-size: 14px;
      color: var(--text-muted);
    }

    .controls-panel {
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .volume-icon {
      font-size: 18px;
      color: var(--text-muted);
      width: 24px;
    }

    .volume-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #3a3a3c;
      outline: none;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--text-main);
      cursor: pointer;
      transition: background 0.15s;
    }

    .volume-slider::-webkit-slider-thumb:hover {
      background: var(--accent-red);
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 12px;
      margin-top: 4px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background: var(--accent-red);
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7);
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(255, 71, 87, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    <div class="header-badge">NCS Live Broadcast</div>
    
    <div class="player-wrapper">
      <div id="youtube-player" style="width:100%; height:100%;"></div>
      
      <div id="unlock-overlay" class="unlock-overlay">
        <button onclick="connectToRadio()" class="connect-btn">▶ Connect to Radio</button>
        <span style="font-size: 12px; color: var(--text-muted);">Click to join live sync</span>
      </div>
      
      <div class="click-shield"></div>
    </div>

    <div class="track-info">
      <h3 id="track-title" class="track-title">Transmitter Standby</h3>
      <p id="track-artist" class="track-artist">Click connect to initialize stream</p>
    </div>

    <div class="controls-panel">
      <div class="volume-container">
        <span id="vol-icon" class="volume-icon">🔊</span>
        <input 
          type="range" 
          id="volume" 
          class="volume-slider" 
          min="0" 
          max="100" 
          value="80" 
          oninput="adjustVolume(this.value)"
        >
      </div>

      <div class="status-row">
        <div class="status-indicator">
          <div class="pulse-dot"></div>
          <span>On Air (Global Sync)</span>
        </div>
        <div id="sync-status">Offset: --</div>
      </div>
    </div>
  </div>
  <script>
    // 1. Complete Playlist Array with Exact Track Durations (in seconds)
    const playlist = [
      { id: "qY0KEx7f_zY", duration: 208 }, // Cartoon - On & On
      { id: "J2X5mJ3HDYE", duration: 264 }, // Alan Walker - Fade
      { id: "3nQNiWdeH7M", duration: 273 }, // DEAF KEV - Invincible
      { id: "i36Z95861bY", duration: 267 }, // Different Heaven & EH!DE - My Heart
      { id: "s61vQrR2mYQ", duration: 197 }, // Unknown Brain - Superhero
      { id: "89IWWVeg80A", duration: 222 }, // Janji - Heroes Tonight
      { id: "K4O4gTxw1c0", duration: 216 }, // Sub Urban - Cradles
      { id: "TW9d8vYrVFQ", duration: 184 }, // Lost Sky - Fearless
      { id: "ux8-Xw0Hj5c", duration: 220 }, // Disfigure - Blank
      { id: "AOeY-nDp7hI", duration: 198 }  // Electro-Light - Symbolism
    ];

    const TOTAL_PLAYLIST_DURATION = playlist.reduce((sum, track) => sum + track.duration, 0);

    function getLiveTrackState() {
      const currentGlobalSeconds = Math.floor(Date.now() / 1000);
      let timeIntoCurrentLoop = currentGlobalSeconds % TOTAL_PLAYLIST_DURATION;
      
      for (let i = 0; i < playlist.length; i++) {
        if (timeIntoCurrentLoop < playlist[i].duration) {
          return {
            videoId: playlist[i].id,
            seekTime: timeIntoCurrentLoop,
            trackIndex: i
          };
        }
        timeIntoCurrentLoop -= playlist[i].duration;
      }
      return { videoId: playlist[0].id, seekTime: 0, trackIndex: 0 };
    }

    let currentBroadcast = getLiveTrackState();
    let currentVideoId = currentBroadcast.videoId;
    let targetTime = currentBroadcast.seekTime;
    var player;
    let connectionAttempts = 0;

    // 2. Load API Framework safely
    var tag = document.createElement('script');
    tag.src = "https://youtube.com";
    document.body.appendChild(tag);

    window.onYouTubeIframeAPIReady = function() {
      player = new YT.Player('youtube-player', {
        height: '100%',
        width: '100%',
        videoId: currentBroadcast.videoId,
        playerVars: {
          'controls': 0,
          'disablekb': 1,
          'rel': 0,
          'modestbranding': 1,
          'start': currentBroadcast.seekTime,
          'enablejsapi': 1
        },
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    };

    function onPlayerStateChange(event) {
      if (event.data == YT.PlayerState.PLAYING) {
        var videoData = player.getVideoData();
        if (videoData && videoData.title) {
          document.getElementById('track-title').innerText = videoData.title;
          document.getElementById('track-artist').innerText = "By: " + videoData.author;
        }
        let currentVol = document.getElementById('volume').value;
        player.setVolume(currentVol);
      }
    }

    // 3. Custom Volume Controller Logic
    function adjustVolume(value) {
      if (player && typeof player.setVolume === 'function') {
        player.setVolume(value);
        
        const iconEl = document.getElementById('vol-icon');
        if (value == 0) iconEl.innerText = "🔇";
        else if (value < 40) iconEl.innerText = "🔈";
        else if (value < 75) iconEl.innerText = "🔉";
        else iconEl.innerText = "🔊";
      }
    }

    // 4. Upgraded Radio Activation Core with Polled Retry Logic
    function connectToRadio() {
      const freshSync = getLiveTrackState();
      
      if (player && typeof player.playVideo === 'function') {
        document.getElementById('unlock-overlay').style.display = 'none';
        targetTime = freshSync.seekTime;
        currentVideoId = freshSync.videoId;
        
        player.seekTo(freshSync.seekTime, true);
        player.playVideo();

        // Master Clock Sync Loop (Checks every 1 second)
        setInterval(function() {
          targetTime++;
          const checkSync = getLiveTrackState();
          
          if (checkSync.videoId !== currentVideoId) {
            currentVideoId = checkSync.videoId;
            targetTime = checkSync.seekTime;
            
            document.getElementById('track-title').innerText = "Buffering next track...";
            document.getElementById('track-artist').innerText = "Synchronising clock";
            
            player.loadVideoById({
              videoId: checkSync.videoId,
              startSeconds: checkSync.seekTime
            });
          }

          if (player && typeof player.getCurrentTime === 'function') {
            const userCurrentTime = player.getCurrentTime();
            const drift = Math.abs(userCurrentTime - targetTime);
            document.getElementById('sync-status').innerText = "Drift: " + drift.toFixed(1) + "s";
            
            if (drift > 2.5) {
              player.seekTo(targetTime, true);
            }
          }
        }, 1000);

      } else {
        connectionAttempts++;
        document.getElementById('track-title').innerText = "Connecting... (Attempt " + connectionAttempts + "/5)";
        document.getElementById('track-artist').innerText = "Waking up stream engines";

        if (connectionAttempts < 5) {
          setTimeout(connectToRadio, 300);
        } else {
          document.getElementById('track-title').innerText = "Initialization Blocked";
          document.getElementById('track-artist').innerText = "Please disable extensions/AdBlock and refresh.";
        }
      }
    }
  </script>
</body>
</html>
